name: Static release

# Builds the static, monolithic charon used by the NekoIMS ePDG dialer for
# x86_64 and arm64 Linux (musl, so it runs on any distro) and attaches the
# tarballs to a GitHub release for tags matching nekoims-*. Manual runs only
# keep the tarballs as workflow artifacts.

on:
  push:
    tags:
      - 'nekoims-*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ALPINE_IMAGE: alpine:3.22

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # baseline: oldest CPU model the binary must run on, checked with
          # qemu-user since the runners have every extension (e.g. ADX)
          - arch: x86_64
            runner: ubuntu-24.04
            qemu: qemu-x86_64
            baseline: Nehalem
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu: qemu-aarch64
            baseline: cortex-a53
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Plain docker run rather than a job container: JavaScript actions
      # don't run in Alpine containers on arm64 runners.
      - name: Build in Alpine
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION \
            -e HOST_IDS="$(id -u):$(id -g)" "$ALPINE_IMAGE" sh -euc '
              apk add --no-cache build-base autoconf automake libtool \
                pkgconf gperf bison flex python3 linux-headers curl xz
              sh .github/scripts/build-static.sh "$VERSION" dist
              chown -R "$HOST_IDS" dist build-static
            '

      - name: Baseline CPU check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          ${{ matrix.qemu }} -cpu ${{ matrix.baseline }} build-static/gmp-check

      - name: Smoke test
        run: |
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          charon=$(echo "$RUNNER_TEMP"/strongswan-nekoims-*/libexec/ipsec/charon)
          file "$charon"
          if readelf -l "$charon" | grep -q INTERP; then
            echo "charon is dynamically linked" >&2
            exit 1
          fi
          # Every plugin the dialer loads must resolve from the built-in
          # table; only the kernel interface may fail without root.
          printf '%s\n' 'charon {' 'load_modular = no' \
            'load = random nonce drbg aes sha1 sha2 hmac gmp curve25519 fips-prf kdf x509 pem pubkey pkcs1 constraints kernel-netlink socket-default vici eap-identity eap-aka eap-aka-http p-cscf' \
            'port = 0' 'port_nat_t = 0' \
            "plugins { vici { socket = unix://$RUNNER_TEMP/charon.vici } }" \
            'filelog { stderr { default = 2 } }' '}' > "$RUNNER_TEMP/test.conf"
          STRONGSWAN_CONF="$RUNNER_TEMP/test.conf" timeout 5 "$charon" \
            > "$RUNNER_TEMP/charon.log" 2>&1 || true
          cat "$RUNNER_TEMP/charon.log"
          for p in eap-aka eap-aka-http p-cscf vici gmp fips-prf; do
            grep -q "plugin '$p': loaded successfully" "$RUNNER_TEMP/charon.log"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: strongswan-nekoims-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # charon-svc for Windows: cross-compiled with llvm-mingw, kernel-libipsec on
  # a Wintun adapter (see .github/scripts/build-windows.sh). x86_64 only, the
  # dialer runs it emulated on arm64 (a clang bug breaks native arm64).
  build-windows:
    name: build (windows-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkgconf             gperf bison flex python3 curl unzip zip xz-utils
          sh .github/scripts/build-windows.sh             "${{ steps.version.outputs.version }}" ${{ matrix.arch }} dist
          # stable names for releases/latest/download (start.ps1)
          cd dist
          cp strongswan-nekoims-*-windows-${{ matrix.arch }}.zip             windows-strongswan-${{ matrix.arch }}.zip
          sha256sum windows-strongswan-${{ matrix.arch }}.zip             > windows-strongswan-${{ matrix.arch }}.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: strongswan-nekoims-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Every plugin the dialer loads must come up; the runner is elevated, so
  # kernel-libipsec creates its Wintun adapter too.
  smoke-windows:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: strongswan-nekoims-windows-x86_64
          path: dist

      - name: Smoke test
        shell: pwsh
        run: |
          Expand-Archive dist/windows-strongswan-x86_64.zip -DestinationPath $env:RUNNER_TEMP
          $svc = Get-ChildItem $env:RUNNER_TEMP -Recurse -Filter charon-svc.exe | Select-Object -First 1
          @"
          charon {
            load_modular = no
            load = random nonce drbg aes sha1 sha2 hmac gmp curve25519 fips-prf kdf x509 pem pubkey pkcs1 constraints kernel-iph socket-win kernel-libipsec vici eap-identity eap-aka eap-aka-http p-cscf
            port = 0
            port_nat_t = 0
            plugins { kernel-libipsec { tun_name = NekoIMS-ci } }
            filelog { stderr { default = 2 } }
          }
          "@ | Set-Content "$env:RUNNER_TEMP/test.conf"
          $env:STRONGSWAN_CONF = "$env:RUNNER_TEMP/test.conf"
          $p = Start-Process $svc.FullName -PassThru -NoNewWindow `
            -RedirectStandardError "$env:RUNNER_TEMP/charon.log"
          Start-Sleep 5
          Stop-Process $p -Force
          Get-Content "$env:RUNNER_TEMP/charon.log"
          foreach ($pl in "eap-aka", "eap-aka-http", "p-cscf", "vici", "gmp", "fips-prf", "kernel-libipsec", "socket-win", "kernel-iph") {
            if (-not (Select-String -Quiet "plugin '$pl': loaded successfully" "$env:RUNNER_TEMP/charon.log")) {
              throw "plugin $pl did not load"
            }
          }

  release:
    if: github.ref_type == 'tag'
    needs: [build, build-windows, smoke-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes "Static monolithic charon (musl) for the NekoIMS ePDG dialer, built from ${GITHUB_SHA}. Extract into /usr/local or pass --charon <dir>/libexec/ipsec/charon to dialers/strongswan-dialer.py; lib/python holds the vici client. The windows-* zips hold charon-svc.exe with Wintun for the same dialer on Windows (start.ps1)."
          fi
